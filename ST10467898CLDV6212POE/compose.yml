version: '3.8'

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite-emulator
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    restart: always

  functions:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: function-app
    ports:
      - "8080:80"
    environment:
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite-emulator:10002/devstoreaccount1;QueueEndpoint=http://azurite-emulator:10001/devstoreaccount1;BlobEndpoint=http://azurite-emulator:10000/devstoreaccount1;
    depends_on:
      - azurite
    restart: always