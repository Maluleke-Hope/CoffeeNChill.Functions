name: CoffeeNChill CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ST10467898CLDV6212POE.slnx

      - name: Build
        run: dotnet build ST10467898CLDV6212POE.slnx --no-restore

  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./CoffeeNChill.ApiGateway
          push: true
          tags: malulekehope/coffeenchill-gateway:v1.0

      - name: Build and push Azure Functions
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ST10467898CLDV6212POE/Dockerfile
          push: true
          tags: malulekehope/coffeenchill-functions:v3.0

  deploy-to-vps:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            cd /home/opc/coffeenchill-deployment
            docker compose pull
            docker compose up -d
